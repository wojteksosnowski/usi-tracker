<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  window.addEventListener('error', function(e) {
    const div = document.createElement('div');
    div.style.position = 'fixed';
    div.style.inset = '0';
    div.style.background = '#800';
    div.style.color = '#fff';
    div.style.padding = '20px';
    div.style.zIndex = '999999';
    div.style.fontFamily = 'monospace';
    div.style.whiteSpace = 'pre-wrap';
    div.innerHTML = '<h1>FATAL UI ERROR</h1>' + 
                    '<b>Message:</b> ' + e.message + '<br>' +
                    '<b>File:</b> ' + e.filename + '<br>' +
                    '<b>Line:</b> ' + e.lineno + '<br>' +
                    '<b>Stack:</b><br>' + (e.error ? e.error.stack : 'no stack');
    document.body.appendChild(div);

    // Send to server
    fetch('/api/ui-error', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: e.message,
        stack: e.error ? e.error.stack : 'no stack',
        url: window.location.href,
        file: e.filename,
        line: e.lineno
      })
    }).catch(err => console.error('Failed to report UI error:', err));
  });
  window.addEventListener('unhandledrejection', function(e) {
    alert('Unhandled Rejection: ' + e.reason);
    fetch('/api/ui-error', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: 'Unhandled Rejection: ' + e.reason,
        stack: e.reason && e.reason.stack ? e.reason.stack : 'no stack',
        url: window.location.href
      })
    }).catch(err => console.error('Failed to report rejection:', err));
  });
  console.log("Diagnostic script initialized.");
  const originalBabelTransform = window.Babel?.transformScriptTags;
  if (originalBabelTransform) {
  console.log("Babel Standalone detected.");
  }
  </script>
